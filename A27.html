function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";

  const st = $("steps"); st.innerHTML = "";
  t("steps").forEach(s => { const c = el("div", "step"); c.append(el("b", "", s[0]), el("span", "", s[1])); st.appendChild(c); });
}
$("lang").onchange = e => { lang = e.target.value; lsSet("a27_lang", lang); render(); };

/* globe of points */
const canvas = $("globe"), ctx = canvas.getContext("2d");
let W = 0, H = 0;
const P = [], N = 1100, GOLD = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) { const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), a = GOLD * i; P.push({ x: Math.cos(a) * r, y, z: Math.sin(a) * r }); }
function size() { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; canvas.width = W * d; canvas.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", size); size();
let ang = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame() {
  if (!reduce) ang += 0.003;
  ctx.clearRect(0, 0, W, H);
  const R = Math.min(W, H) * 0.42, cx = W / 2, cy = H / 2, ca = Math.cos(ang), sa = Math.sin(ang), ct = Math.cos(0.4), st = Math.sin(0.4);
  for (const p of P) {
    const x1 = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca, y2 = p.y * ct - z1 * st, z2 = p.y * st + z1 * ct, d = (z2 + 1) / 2;
    ctx.fillStyle = "rgba(255,255,255," + (0.06 + d * d * 0.8).toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(cx + x1 * R, cy + y2 * R, 0.5 + d * 1.6, 0, 6.2832); ctx.fill();
  }
  if (!document.hidden) requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) requestAnimationFrame(frame); });
requestAnimationFrame(frame);
